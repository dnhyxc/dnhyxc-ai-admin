services:
  # Admin 主库：后台自身的用户 / 角色 / 菜单 / 操作日志
  admin-db:
    image: mysql:8.0
    container_name: dnhyxc_admin_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: dnhyxc_admin_db
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=128M
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - 3093:3306
    volumes:
      # 与 dnhyxc-ai 一致：数据落在仓库外 ../mysql/
      - ../mysql/admin-db:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      timeout: 20s
      retries: 10

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 3094:8080
    depends_on:
      admin-db:
        condition: service_healthy

  # 本地 Redis（可选；未配置 REDIS_URL 时后端会回退内存缓存）
  redis:
    image: redis:7-alpine
    container_name: dnhyxc_admin_redis
    restart: always
    ports:
      - 6379:6379
    command: redis-server --appendonly yes
